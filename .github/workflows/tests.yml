# يشغّل اختبارات التطبيق تلقائيًا مع كل تحديث، حتى لا يُنشر خطأ.
name: tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: for f in js/*.js js/data/*.js sw.js; do node --check "$f"; done
      - name: Run tests
        run: node tests/run.js
