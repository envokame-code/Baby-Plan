<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4f7f6" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#111617" media="(prefers-color-scheme: dark)">
  <meta name="description" content="خطة طفلي: متابعة تغذية وحركة ونمو ورعاية طفلك من الولادة حتى 4 سنوات، بمسارات مخصصة ومصادر طبية معتمدة.">
  <title>خطة طفلي</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="خطة طفلي">
  <link rel="preload" href="fonts/plex-arabic-400.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/styles.css">
  <script>
    /* طبّق المظهر وحجم الخط قبل الرسم لتجنب الوميض */
    try {
      var st = JSON.parse(localStorage.getItem('babyplan.v1') || '{}').settings || {};
      var th = st.theme || '';
      if (st.autoNight) { var h = new Date().getHours(); if (h >= 22 || h < 6) th = 'night'; }
      if (th) document.documentElement.setAttribute('data-theme', th);
      if (st.size) document.documentElement.setAttribute('data-size', st.size);
    } catch (e) { /* ignore */ }
  </script>
</head>
<body>
  <svg width="0" height="0" style="position:absolute;top:0;left:0;overflow:hidden" aria-hidden="true">
    <symbol id="i-home" viewBox="0 0 24 24"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v9.5h13V10"/><path d="M10 19.5v-5h4v5"/></symbol>
    <symbol id="i-log" viewBox="0 0 24 24"><rect x="5" y="4" width="14" height="17" rx="2.5"/><path d="M9 4V2.8h6V4"/><path d="M8.5 10h7M8.5 13.5h7M8.5 17h4"/></symbol>
    <symbol id="i-growth" viewBox="0 0 24 24"><path d="M4 20V4"/><path d="M4 20h16"/><path d="M7 16c3-1 5-4 6-7s3-4 6-4"/></symbol>
    <symbol id="i-book" viewBox="0 0 24 24"><path d="M12 6.5C10 5 7 4.5 4 5v13.5c3-.5 6 0 8 1.5 2-1.5 5-2 8-1.5V5c-3-.5-6 0-8 1.5Z"/><path d="M12 6.5V20"/></symbol>
    <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 3 5 6v5.5c0 4.5 3 8 7 9.5 4-1.5 7-5 7-9.5V6l-7-3Z"/><path d="M9 12l2 2 4-4"/></symbol>
    <symbol id="i-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2.5v2.5M12 19v2.5M4.6 4.6l1.8 1.8M17.6 17.6l1.8 1.8M2.5 12H5M19 12h2.5M4.6 19.4l1.8-1.8M17.6 6.4l1.8-1.8"/></symbol>
    <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 3.5 2.5 20h19L12 3.5Z"/><path d="M12 10v4.5M12 17.2v.3"/></symbol>
    <symbol id="i-breast" viewBox="0 0 24 24"><path d="M12 21c-4.5 0-8-3.6-8-8 0-4 3.5-8 8-9.5 4.5 1.5 8 5.5 8 9.5 0 4.4-3.5 8-8 8Z"/><circle cx="12" cy="13.5" r="1.6"/></symbol>
    <symbol id="i-bottle" viewBox="0 0 24 24"><path d="M10 2.5h4v3h-4z"/><path d="M9 5.5h6l1 3v11a2 2 0 0 1-2 2h-4a2 2 0 0 1-2-2v-11l1-3Z"/><path d="M8 12h3M8 15.5h3"/></symbol>
    <symbol id="i-pump" viewBox="0 0 24 24"><path d="M5 9a7 7 0 0 1 14 0"/><path d="M12 9v4"/><path d="M8.5 13h7l-1 8h-5l-1-8Z"/></symbol>
    <symbol id="i-food" viewBox="0 0 24 24"><path d="M3 11h18a9 9 0 0 1-18 0Z"/><path d="M8 7c0-1.5 1-1.5 1-3M12 7c0-1.5 1-1.5 1-3M16 7c0-1.5 1-1.5 1-3"/></symbol>
    <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5Z"/></symbol>
    <symbol id="i-diaper" viewBox="0 0 24 24"><path d="M3 6h18v4a9 9 0 0 1-18 0V6Z"/><path d="M8 6v3M16 6v3"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><rect x="3" y="12" width="8" height="8" rx="1.5"/><rect x="13" y="12" width="8" height="8" rx="1.5"/><rect x="8" y="3.5" width="8" height="8" rx="1.5"/></symbol>
    <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6 6 6M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4 6 18M18 6l1.4-1.4"/></symbol>
    <symbol id="i-thermo" viewBox="0 0 24 24"><path d="M10 14.5V5a2 2 0 0 1 4 0v9.5a4 4 0 1 1-4 0Z"/><path d="M12 9v7"/></symbol>
    <symbol id="i-pill" viewBox="0 0 24 24"><rect x="3" y="8.5" width="18" height="7" rx="3.5" transform="rotate(-45 12 12)"/><path d="m9.5 9.5 5 5"/></symbol>
    <symbol id="i-walk" viewBox="0 0 24 24"><circle cx="13" cy="4.5" r="1.8"/><path d="M10 21l2-6 3 2v4M12 15l-1-5 4 1 2 3M11 10l-3 2-1 3"/></symbol>
    <symbol id="i-heart" viewBox="0 0 24 24"><path d="M12 20s-7.5-4.5-7.5-10A4.3 4.3 0 0 1 12 7.5 4.3 4.3 0 0 1 19.5 10c0 5.5-7.5 10-7.5 10Z"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-edit" viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16v4Z"/><path d="m13.5 6.5 4 4"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4.5h6V7M6.5 7l1 13h9l1-13"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></symbol>
    <symbol id="i-child" viewBox="0 0 24 24"><circle cx="12" cy="9" r="5"/><path d="M5 21c1-3.5 3.8-5 7-5s6 1.5 7 5"/><path d="M10.3 9.5h.01M13.7 9.5h.01M10.5 11.5c.9.7 2.1.7 3 0"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 4v11M7.5 10.5 12 15l4.5-4.5M5 20h14"/></symbol>
    <symbol id="i-print" viewBox="0 0 24 24"><path d="M7 9V4h10v5"/><rect x="4" y="9" width="16" height="7" rx="2"/><path d="M7 14h10v6H7z"/></symbol>
    <symbol id="i-note" viewBox="0 0 24 24"><path d="M5 4h14v12l-4 4H5V4Z"/><path d="M15 20v-4h4M8.5 9h7M8.5 12.5h5"/></symbol>
    <symbol id="i-phone" viewBox="0 0 24 24"><path d="M6 3.5h3l1.5 4-2 1.5a11 11 0 0 0 6.5 6.5l1.5-2 4 1.5v3a2 2 0 0 1-2 2A16 16 0 0 1 4 5.5a2 2 0 0 1 2-2Z"/></symbol>
    <symbol id="i-tooth" viewBox="0 0 24 24"><path d="M7.5 4C5 4 4 6 4 8c0 3 1.5 4.5 2 7 .5 3 1 5.5 2.5 5.5S10 17 12 17s2 3.5 3.5 3.5S17.5 18 18 15c.5-2.5 2-4 2-7 0-2-1-4-3.5-4-2 0-3 1-4.5 1S9.5 4 7.5 4Z"/></symbol>
    <symbol id="i-swap" viewBox="0 0 24 24"><path d="M7 7h12l-3-3M17 17H5l3 3"/></symbol>
    <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="2.5"/><path d="M4 10h16M8.5 3v4M15.5 3v4"/></symbol>
  </svg>

  <header class="topbar">
    <div class="topbar-in">
      <img class="logo" src="icons/icon.svg" alt="">
      <h1 class="title" id="topTitle">خطة طفلي</h1>
      <button class="icon-btn sos" data-action="go" data-view="care" data-sub="danger"><svg class="i"><use href="#i-alert"/></svg>طوارئ</button>
      <button class="icon-btn" data-action="go" data-view="settings" aria-label="الإعدادات"><svg class="i"><use href="#i-gear"/></svg></button>
    </div>
  </header>

  <main id="app" tabindex="-1"></main>

  <nav class="tabs" id="tabs" aria-label="الأقسام">
    <div class="in">
      <button data-action="go" data-view="home"><svg class="i"><use href="#i-home"/></svg>الرئيسية</button>
      <button data-action="go" data-view="growth"><svg class="i"><use href="#i-growth"/></svg>النمو</button>
      <button data-action="go" data-view="guide"><svg class="i"><use href="#i-book"/></svg>الدليل</button>
      <button data-action="go" data-view="care"><svg class="i"><use href="#i-shield"/></svg>الرعاية</button>
    </div>
  </nav>

  <div id="modal"></div>
  <div id="toast" class="toast" role="status" hidden></div>

  <script src="js/bundle.js"></script>
</body>
</html>
